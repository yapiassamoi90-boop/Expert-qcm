<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCM Technique Gigantesque</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="container">
    
    <!-- Signature en haut à droite -->
    <div class="dev-signature">Dev.Assamoi</div>

    <!-- ÉCRAN D'ACCUEIL -->
    <div id="home-screen" class="screen">
      <h1>🚀 QCM Technique Gigantesque</h1>
      <p>Sélectionne ton domaine d'expertise (20 questions par test avec chronomètre de 30s) :</p>
      
      <div class="domain-grid">
        <button class="domain-btn" data-domain="Hydraulique">💧 Hydraulique</button>
        <button class="domain-btn" data-domain="Électricité">⚡ Électricité Industrielle</button>
        <button class="domain-btn" data-domain="Mécanique">⚙️ Mécanique & Engins</button>
        <button class="domain-btn" data-domain="Navale">⚓ Mécanique Navale</button>
        <button class="domain-btn" data-domain="Français">📚 Français (Grammaire)</button>
        <button class="domain-btn" data-domain="Anglais">🇬🇧 Anglais (Grammar)</button>
      </div>
    </div>

    <!-- ÉCRAN DU QUIZ (masqué par défaut avec .hidden) -->
    <div id="quiz-screen" class="screen hidden">
      <div class="quiz-header">
        <span id="progress-text">Question 1 / 20</span>
        <span id="timer-text">⏱️ 30s</span>
      </div>
      
      <div class="progress-bar">
        <div id="progress"></div>
      </div>

      <div id="image-container"></div>
      <h2 id="question-text">Chargement de la question...</h2>
      
      <div id="options-container"></div>
    </div>

    <!-- ÉCRAN DES RÉSULTATS (masqué par défaut avec .hidden) -->
    <div id="result-screen" class="screen hidden">
      <h2>🎉 Test Terminé !</h2>
      <div id="score-card">
        <p>Ton score final :</p>
        <div id="score-text" style="font-size: 24px; font-weight: bold; color: var(--accent);">0 / 20</div>
        <blockquote id="feedback-text"></blockquote>
      </div>
      
      <h3>🔍 Correction Détaillée</h3>
      <div id="correction-container"></div>

      <button id="restart-btn" class="domain-btn" style="margin-top: 15px; width: 100%;">🔄 Retour au Menu Principal</button>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
